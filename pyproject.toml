[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".venv",
    "frontend",
    "reference",
    "templates/data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"test*.py" = ["E402"]
"test/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
